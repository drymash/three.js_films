<style>
/* Layout: two worlds in one frame — the dark hologram studio and the drone's own sensor picture, joined by an iris through the lens. Vertical-first, single dark look by design. */
:root{
  --bg:#0b0f16;
  --fg:#eef1f4;
  --muted:#8e9aab;
  --accent:#ff7a3d;
  --display:'Oswald','Arial Narrow',Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#fade{position:fixed;inset:0;background:#000;pointer-events:none;z-index:9}
.ui{position:fixed;z-index:5;pointer-events:none}
.corners{inset:2.2vmin}
.corners i{position:absolute;width:3.2vmin;height:3.2vmin;border:0 solid rgba(255,255,255,.35)}
.corners i:nth-child(1){left:0;top:0;border-left-width:1.5px;border-top-width:1.5px}
.corners i:nth-child(2){right:0;top:0;border-right-width:1.5px;border-top-width:1.5px}
.corners i:nth-child(3){left:0;bottom:0;border-left-width:1.5px;border-bottom-width:1.5px}
.corners i:nth-child(4){right:0;bottom:0;border-right-width:1.5px;border-bottom-width:1.5px}
#chapter{left:max(5vmin,env(safe-area-inset-left,0px));top:6.5vh;font:600 clamp(10px,1.9vmin,16px)/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase}
#chapter .bar{margin-top:8px;width:22vmin;height:2px;background:rgba(255,255,255,.18)}
#chapter .bar b{display:block;height:100%;width:0;background:var(--accent)}
#chapter .num{color:var(--accent)}
#mark{right:max(5vmin,env(safe-area-inset-right,0px));top:6.5vh;font:600 clamp(10px,1.9vmin,16px)/1.3 var(--mono);letter-spacing:.14em;color:var(--muted);text-align:right}

#rubric{left:0;right:0;top:15vh;text-align:center;opacity:0}
#rubric .eyebrow{font:600 clamp(12px,2.4vmin,22px)/1 var(--mono);letter-spacing:.3em;color:var(--accent)}

#callouts{inset:0}

.co{position:absolute;display:flex;align-items:center;gap:8px;transform:translate(-6px,-50%);opacity:0;white-space:nowrap;

.co.left{flex-direction:row-reverse;transform:translate(calc(-100% + 6px),-50%)}
.co i{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(255,122,61,.28);flex:none}
.co span{background:rgba(8,14,26,.82);padding:6px 11px;border:1px solid rgba(255,255,255,.2);border-radius:3px}
.co small{display:block;font-weight:400;color:var(--muted);font-size:.74em;margin-top:2px}
.co.white i{background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.2)}

/* sensor picture furniture */
#sensor{inset:0;opacity:0;font:600 clamp(11px,2.2vmin,20px)/1.4 var(--mono);letter-spacing:.14em;color:#e9efe6;text-shadow:0 0 4px rgba(0,0,0,.9)}
#sensor .tl,#sensor .tr{position:absolute;top:13vh}
#sensor .tl{left:max(5vmin,16px)}
#sensor .tr{right:max(5vmin,16px);text-align:right}
#sensor .sides{position:absolute;left:0;right:0;top:20vh;display:flex;justify-content:space-between;padding-inline:max(5vmin,16px)}
#sensor .sides b{padding:4px 9px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.35);font-weight:600}
#sensor .sides b.hot{border-color:var(--accent);color:var(--accent)}
#sensor .fov{position:absolute;left:0;right:0;bottom:31vh;text-align:center}
#sensor .fov em{font-style:normal;color:var(--accent)}
#bracket{position:fixed;z-index:5;pointer-events:none;opacity:0;border:0}
#bracket i{position:absolute;width:22%;height:22%;border:0 solid var(--accent)}
#bracket i:nth-child(1){left:0;top:0;border-left-width:2px;border-top-width:2px}
#bracket i:nth-child(2){right:0;top:0;border-right-width:2px;border-top-width:2px}
#bracket i:nth-child(3){left:0;bottom:0;border-left-width:2px;border-bottom-width:2px}
#bracket i:nth-child(4){right:0;bottom:0;border-right-width:2px;border-bottom-width:2px}

/* stabilisation comparison */
#stab{left:max(5vmin,16px);right:max(5vmin,16px);bottom:26vh;display:flex;gap:4vmin;justify-content:center;opacity:0}
#stab figure{margin:0;flex:1;max-width:40vmin}
#stab .box{position:relative;aspect-ratio:4/3;max-width:100%;overflow:hidden;border:1.5px solid rgba(255,255,255,.4);background:#1b1f22}
#stab .box.ok{border-color:var(--accent)}
#stab svg{position:absolute;inset:-12%;width:124%;height:124%}
#stab figcaption{margin-top:8px;text-align:center;font:600 clamp(10px,2.1vmin,18px)/1.3 var(--mono);letter-spacing:.14em;color:var(--muted)}
#stab .ok + figcaption{color:var(--accent)}

/* recognition card */
#recog{left:max(5vmin,16px);right:max(5vmin,16px);bottom:24vh;display:flex;gap:4vmin;justify-content:center;opacity:0}
#recog figure{margin:0;flex:1;max-width:40vmin;padding:2vmin;border:1.5px solid rgba(255,255,255,.3);background:rgba(8,14,26,.72)}
#recog svg{width:100%;height:auto;display:block}
#recog figcaption{margin-top:1vmin;text-align:center;font:600 clamp(11px,2.3vmin,20px)/1.3 var(--mono);letter-spacing:.14em;color:var(--muted)}
#recog .match{border-color:var(--accent)}
#recog .match figcaption{color:var(--accent)}
#recog .no{opacity:.45}

#controls{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;align-items:center;gap:12px;
  padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font:400 12px/1 var(--mono);color:var(--muted);opacity:.35;transition:opacity .25s}
#controls:hover,#controls:focus-within{opacity:1}
#controls button{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;color:var(--fg);background:rgba(255,255,255,.08)}
#controls button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#controls svg{width:14px;height:14px;fill:currentColor}
#scrub{flex:1;min-width:0;accent-color:var(--accent)}
#time{font-variant-numeric:tabular-nums;min-width:9ch;text-align:right;color:var(--fg)}
</style>

      <path d="M18 52 Q14 64 26 66 L176 66 Q190 64 184 52 Z" fill="none" stroke="currentColor" stroke-width="2.2"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(() => {
const DUR = 23;
const $ = s => document.querySelector(s);
const clamp01 = x => Math.min(1, Math.max(0, x));
const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const win = (a, b, c, d, t) => smooth(a, b, t) * (1 - smooth(c, d, t));
const V = (x, y, z) => new THREE.Vector3(x, y, z);

/* voice-over lines this scene is paced to (no captions on screen; retime after the recording)
   0.4–2.6   А тепер — головне. Куля під носом.
   2.8–5.2   Ця куля важить, як доросла людина.
   5.4–8.0   Всередині — денна камера з потужним зумом
   8.1–11.4  і тепловізор: він бачить тепло мотора крізь ніч і туман.
   11.6–13.6 І все це — на стабілізованому підвісі.
   13.7–17.2 Дрон хитається на вітрі, а картинка стоїть, як прибита.
   17.5–21.0 З п'яти кілометрів видно, що це — БМП, а не вантажівка. */

/* ---------- renderer ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
$('#stage').appendChild(renderer.domElement);
const W = () => Math.floor(innerWidth * renderer.getPixelRatio()), H = () => Math.floor(innerHeight * renderer.getPixelRatio());
function fitFov(f) {
  const a = innerWidth / innerHeight;
  if (a >= 1) return f;
  const tanH = Math.tan(f * Math.PI / 360) * (16 / 9) * 0.6;
  return 2 * Math.atan(tanH / a) * 180 / Math.PI;
}

/* =================== STUDIO =================== */
const studio = new THREE.Scene();
studio.background = new THREE.Color(0x0b0f16);
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 400);
const FLOOR_Y = -1.16;
{
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.ShaderMaterial({
    depthWrite: false, extensions: { derivatives: true },
    vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `varying vec3 vW;
      float line(float c, float w){ float f = abs(fract(c - 0.5) - 0.5) / fwidth(c); return 1.0 - min(f / w, 1.0); }
      void main(){ float r = length(vW.xz - vec2(2.0, 1.5)); float pool = exp(-r * r / 120.0);
        float g = max(line(vW.x, 1.0), line(vW.z, 1.0)) * 0.10 + max(line(vW.x / 5.0, 1.2), line(vW.z / 5.0, 1.2)) * 0.16;
        vec3 c = vec3(0.043, 0.059, 0.086) + vec3(0.05, 0.08, 0.12) * pool + vec3(0.25, 0.5, 0.9) * g * (0.25 + pool);
        gl_FragColor = vec4(c, 1.0); }`
  }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = FLOOR_Y; studio.add(floor);
}
const holoMats = [];
function holoMat(base) {
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    uniforms: { uHi: { value: 0 }, uTime: { value: 0 }, uFade: { value: 1 }, uBase: { value: base || new THREE.Color(0.22, 0.50, 1.0) } },
    vertexShader: `varying vec3 vN; varying vec3 vV; varying vec3 vW;
      void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz);
        vW = (modelMatrix * vec4(position,1.0)).xyz; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform float uHi, uTime, uFade; uniform vec3 uBase; varying vec3 vN; varying vec3 vV; varying vec3 vW;
      void main(){ float rim = pow(1.0 - clamp(abs(dot(normalize(vN), normalize(vV))), 0.0, 1.0), 2.0);
        float scan = 0.5 + 0.5 * sin(vW.y * 60.0 - uTime * 3.0);
        vec3 org = vec3(1.0, 0.42, 0.16);
        vec3 c = mix(uBase * (0.10 + 0.75 * rim + 0.05 * scan), org * (0.55 + 0.6 * rim), uHi);
        gl_FragColor = vec4(c * uFade, 1.0); }`
  });
  holoMats.push(m); return m;
}
const parts = {};
function add(kind, geo, x, y, z, parent, rx, base) {
  const mat = holoMat(base);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z); if (rx) mesh.rotation.x = rx;
  const em = new THREE.LineBasicMaterial({ color: base ? 0xffffff : 0x5aa8ff, transparent: true, opacity: 0.38, depthWrite: false, blending: THREE.AdditiveBlending });
  mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 28), em));
  parent.add(mesh);
  (parts[kind] = parts[kind] || []).push({ mat, em, base: !!base });
  return mesh;
}
const setHi = (kind, v) => (parts[kind] || []).forEach(({ mat, em, base }) => {
  mat.uniforms.uHi.value = v;
  if (base) return;
  em.color.setRGB(lerp(0.35, 1.0, v), lerp(0.66, 0.48, v), lerp(1.0, 0.24, v)); em.opacity = lerp(0.38, 0.9, v);
});
const setFade = (kind, v) => (parts[kind] || []).forEach(({ mat, em }) => { mat.uniforms.uFade.value = v; em.opacity = 0.38 * v; });
const cyl = (r1, r2, h, s) => new THREE.CylinderGeometry(r1, r2, h, s || 14);
const alongX = g => { g.rotateZ(-Math.PI / 2); return g; };
const across = g => { g.rotateX(Math.PI / 2); return g; };

/* the drone (forward = +x) with a detailed gimbal under the nose */
const rig = new THREE.Group(); studio.add(rig);          // rocks in the wind
const drone = new THREE.Group(); rig.add(drone);
const BALL = V(2.25, -0.62, 0);
{
  const prof = [[0,-3.25],[0.14,-3.2],[0.22,-2.9],[0.34,-2.0],[0.44,-0.8],[0.48,0.4],[0.48,1.8],[0.44,2.5],[0.34,2.9],[0.18,3.15],[0,3.27]].map(([r, y]) => new THREE.Vector2(r, y));
  const fg = new THREE.LatheGeometry(prof, 28); fg.rotateZ(-Math.PI / 2); fg.scale(1, 1.05, 0.92);
  add('body', fg, 0, 0, 0, drone);
  const ws = new THREE.Shape();
  ws.moveTo(0.5, 0); ws.lineTo(0.3, 6); ws.lineTo(-0.2, 6.05); ws.lineTo(-0.45, 0); ws.lineTo(-0.2, -6.05); ws.lineTo(0.3, -6); ws.closePath();
  const wg = new THREE.ExtrudeGeometry(ws, { depth: 0.09, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 1 }); wg.rotateX(Math.PI / 2);
  add('body', wg, 0.45, 0.5, 0, drone);
  [1, -1].forEach(s => {
    add('body', alongX(cyl(0.06, 0.07, 4.6, 10)), -1.9, 0.42, 1.3 * s, drone);
    const fin = add('body', new THREE.BoxGeometry(0.7, 1.35, 0.05), -4.0, 0.42 - 0.67 * Math.cos(0.7), (1.3 + 0.67 * Math.sin(0.7)) * s, drone); fin.rotation.x = -0.7 * s;
    add('body', new THREE.BoxGeometry(0.12, 0.9, 0.05), 0.3, -0.62, 0.42 * s, drone, 0.7 * s);
    add('body', across(cyl(0.15, 0.15, 0.08, 14)), 0.3, -0.98, 0.72 * s, drone);
  });
  add('body', cyl(0.03, 0.03, 0.6, 6), 2.7, -0.7, 0, drone);
  add('body', across(cyl(0.12, 0.12, 0.07, 14)), 2.7, -1.0, 0, drone);
  add('body', new THREE.BoxGeometry(0.25, 0.22, 0.04), 1.3, 0.55, 0, drone);
  const prop = new THREE.Group(); prop.position.set(-3.38, 0, 0); drone.add(prop); drone.userData.prop = prop;
  add('body', new THREE.BoxGeometry(0.05, 1.7, 0.13), 0, 0, 0, prop, 0.15);
}
/* gimbal: mount → yaw ring → pitch ring → pointer (shell halves + the two cameras) */
const mount = add('mount', cyl(0.09, 0.09, 0.16, 12), BALL.x, -0.44, 0, drone);
const yawRing = new THREE.Group(); yawRing.position.copy(BALL); drone.add(yawRing);
const ringY = new THREE.TorusGeometry(0.285, 0.011, 8, 48); ringY.rotateX(Math.PI / 2);
add('rings', ringY, 0, 0, 0, yawRing);
const pitchRing = new THREE.Group(); yawRing.add(pitchRing);
add('rings', new THREE.TorusGeometry(0.265, 0.011, 8, 48), 0, 0, 0, pitchRing);
const pointer = new THREE.Group(); pitchRing.add(pointer);
const shellA = new THREE.Group(), shellB = new THREE.Group(); pointer.add(shellA, shellB);
add('shell', new THREE.SphereGeometry(0.24, 28, 18, 0, Math.PI), 0, 0, 0, shellA);
add('shell', new THREE.SphereGeometry(0.24, 28, 18, Math.PI, Math.PI), 0, 0, 0, shellB);
const dayCam = new THREE.Group(); dayCam.position.set(0.02, 0.05, 0); pointer.add(dayCam);
add('day', alongX(cyl(0.068, 0.068, 0.3, 20)), 0, 0, 0, dayCam);
const dayLenses = [0, 1, 2, 3].map(i => add('day', alongX(cyl(0.062, 0.062, 0.012, 24)), 0.05 + i * 0.03, 0, 0, dayCam));
add('day', alongX(cyl(0.064, 0.064, 0.006, 24)), 0.152, 0, 0, dayCam);
const irCam = new THREE.Group(); irCam.position.set(0.04, -0.1, 0); pointer.add(irCam);
add('ir', alongX(cyl(0.048, 0.048, 0.22, 18)), 0, 0, 0, irCam);
add('ir', alongX(cyl(0.046, 0.046, 0.006, 20)), 0.112, 0, 0, irCam);
const IR_LENS_LOCAL = V(0.115, -0.1, 0);

/* line of sight to a fixed mark on the floor, for the stabilisation beat */
const MARK = V(6.2, FLOOR_Y, 2.6);
const markRing = new THREE.Mesh(new THREE.RingGeometry(0.28, 0.33, 48), new THREE.MeshBasicMaterial({ color: 0xff7a3d, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false }));
markRing.rotation.x = -Math.PI / 2; markRing.position.copy(MARK).add(V(0, 0.01, 0)); studio.add(markRing);
const sightGeo = new THREE.BufferGeometry().setFromPoints([V(0, 0, 0), V(1, 0, 0)]);
const sight = new THREE.Line(sightGeo, new THREE.LineDashedMaterial({ color: 0xff9a66, dashSize: 0.12, gapSize: 0.08, transparent: true, opacity: 0 }));
sight.frustumCulled = false; studio.add(sight);

/* the balance: ball on one pan, a person on the other */
const BAL = V(4.1, FLOOR_Y, 3.6);
const WHITE = new THREE.Color(0.75, 0.82, 0.92);
const balance = new THREE.Group(); balance.position.copy(BAL); studio.add(balance);

    split = smooth(10.0, 11.2, t) * 0.62;
  } else { // zoom ladder onto one vehicle
    const z1 = smooth(18.4, 19.0, t), z2 = smooth(19.4, 20.4, t);
    hfov = lerp(lerp(24, 10, z1), 1.7, z2);
    aim = V(0, 1, 0).lerp(HERO.position.clone().add(V(0, 0.2, -2.2)), smooth(18.6, 20.2, t));
    split = 0; irOnly = 0;
  }
  clearDay = t > 14;
  if (sensorOn) {
    sensorCam(t, aim, hfov);
    setMode(false); renderer.setRenderTarget(rtDay); renderer.render(field, scam);
    setMode(true); renderer.setRenderTarget(rtIr); renderer.render(field, scam);
    renderer.setRenderTarget(null);
  }
  if (!sensorFull) composer.render();

  /* iris centre follows the lens on screen */
  const lensScreen = (t < 14 ? irCam.localToWorld(IR_LENS_LOCAL.clone().sub(V(0.04, -0.1, 0))) : pointer.localToWorld(V(0.24, 0, 0))).project(cam);
  Q.uCenter.value.set((lensScreen.x + 1) / 2, (lensScreen.y + 1) / 2);
  Q.tStudio.value = composer.readBuffer.texture;
  Q.tDay.value = rtDay.texture; Q.tIr.value = rtIr.texture;
  Q.uIris.value = iris; Q.uAspect.value = innerWidth / innerHeight;
  Q.uSplit.value = split; Q.uIrOnly.value = irOnly; Q.uTime.value = t; Q.uSensor.value = sensorFull;
  renderer.render(quadScene, quadCam);

  /* --- DOM layers --- */
  $('#rubric').style.opacity = win(0.1, 0.5, 1.4, 1.9, t);
  const sensUI = sensorFull ? 1 : 0;
  $('#sensor').style.opacity = sensUI;
  $('#sides').style.opacity = t < 14 ? smooth(10.0, 10.4, t) : 0;
  $('#fov').style.opacity = t > 14 ? 1 - smooth(19.6, 19.9, t) : 0;
  $('#fovv').textContent = hfov.toFixed(1) + '°';
  $('#smode').textContent = t < 14 ? 'ДЕНЬ · ТЕПЛО' : 'ДЕНЬ · ЗУМ';
  const secs = 31 * 60 + 12 + Math.floor(t);
  $('#sclock').textContent = '06:' + pad2(Math.floor(secs / 60) % 60) + ':' + pad2(secs % 60);
  $('#stab').style.opacity = win(14.4, 14.9, 17.0, 17.4, t);
  const sh = gust * 1.0;
  $('#shakeg').setAttribute('transform', `translate(${(7 * Math.sin(t * 9.1) + 4 * Math.sin(t * 17.3)) * sh} ${(6 * Math.sin(t * 7.7 + 1) + 3 * Math.sin(t * 21.1)) * sh}) rotate(${4 * Math.sin(t * 5.3) * sh} 60 45)`);
  const ra = win(19.9, 20.4, 22.6, 23.0, t);
  $('#recog').style.opacity = ra;
  $('#rBmp').classList.toggle('match', t > 20.6); $('#rTruck').classList.toggle('no', t > 20.6);
  /* identification bracket around the hero vehicle in the sensor picture */
  if (t > 20.0 && sensorFull) {
    const box = new THREE.Box3().setFromObject(HERO);
    const corners = [];
    for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) corners.push(V(x, y, z).project(scam));
    const xs = corners.map(c => (c.x + 1) / 2 * innerWidth), ys = corners.map(c => (1 - c.y) / 2 * innerHeight);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys), m = 10;
    Object.assign(brk.style, { left: (x0 - m) + 'px', top: (y0 - m) + 'px', width: (x1 - x0 + 2 * m) + 'px', height: (y1 - y0 + 2 * m) + 'px' });
    brk.style.opacity = smooth(20.0, 20.4, t);
  } else brk.style.opacity = 0;

  $('#prog').style.width = (100 * t / DUR) + '%';
  $('#fade').style.opacity = 1 - smooth(0, 0.4, t);
  updateCallouts(sensorFull ? -1 : t);
}

/* =================== transport and capture contract =================== */
const scrub = $('#scrub'), timeEl = $('#time'), playBtn = $('#play');
let t = 0, playing = !window.matchMedia('(prefers-reduced-motion: reduce)').matches, last = performance.now(), scrubbing = false;
function setPlaying(p) { playing = p; $('#icoPause').hidden = !p; $('#icoPlay').hidden = p; playBtn.setAttribute('aria-label', p ? 'Пауза' : 'Відтворити'); }
setPlaying(playing); if (!playing) t = 10.6;
playBtn.addEventListener('click', () => setPlaying(!playing));
scrub.addEventListener('input', () => { scrubbing = true; t = parseFloat(scrub.value); });
scrub.addEventListener('change', () => { scrubbing = false; });
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing && !scrubbing) { t += dt; if (t >= DUR) t -= DUR; }
  render(t);
  if (!scrubbing) scrub.value = t.toFixed(2);
  timeEl.textContent = t.toFixed(1).padStart(4, '0') + ' / ' + DUR.toFixed(1);
  requestAnimationFrame(loop);
}
window.addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  rtDay.setSize(W(), H()); rtIr.setSize(W(), H());
});
window.DURATION = DUR; window.FPS = 30;
window.seek = s => { t = s; render(s); };
if (new URLSearchParams(location.search).has('render')) { $('#controls').hidden = true; render(0); }
else requestAnimationFrame(loop);
})();
</script>

<title>Ціна · Небо дивиться</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: price as stacked cubes (TB2 vs MQ-9), then the map of Ukraine: eyes of the country, the people's
   fundraiser, the front closing up and small drones taking over while TB2 moves to deep recon and the sea. */
:root{
  --bg:#0b0f16;
  --fg:#eef1f4;
  --muted:#8e9aab;
  --accent:#ff7a3d;
  --display:'Oswald','Arial Narrow',Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden}
#diagram{position:fixed;inset:0;width:100%;height:100%;display:block}
#grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;opacity:.07;mix-blend-mode:screen;image-rendering:pixelated}
#vig{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 45%,rgba(0,0,0,.55) 100%)}
#fade{position:fixed;inset:0;background:#000;pointer-events:none;z-index:9}
.ui{position:fixed;z-index:5;pointer-events:none}
.corners{inset:2.2vmin}
.corners i{position:absolute;width:3.2vmin;height:3.2vmin;border:0 solid rgba(255,255,255,.35)}
.corners i:nth-child(1){left:0;top:0;border-left-width:1.5px;border-top-width:1.5px}
.corners i:nth-child(2){right:0;top:0;border-right-width:1.5px;border-top-width:1.5px}
.corners i:nth-child(3){left:0;bottom:0;border-left-width:1.5px;border-bottom-width:1.5px}
.corners i:nth-child(4){right:0;bottom:0;border-right-width:1.5px;border-bottom-width:1.5px}
#chapter{left:max(5vmin,env(safe-area-inset-left,0px));top:6.5vh;font:600 clamp(10px,1.9vmin,16px)/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase}
#chapter .bar{margin-top:8px;width:22vmin;height:2px;background:rgba(255,255,255,.18)}
#chapter .bar b{display:block;height:100%;width:0;background:var(--accent)}
#chapter .num{color:var(--accent)}
#mark{right:max(5vmin,env(safe-area-inset-right,0px));top:6.5vh;font:600 clamp(10px,1.9vmin,16px)/1.3 var(--mono);letter-spacing:.14em;color:var(--muted);text-align:right}
#controls{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;align-items:center;gap:12px;
  padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font:400 12px/1 var(--mono);color:var(--muted);opacity:.35;transition:opacity .25s}
#controls:hover,#controls:focus-within{opacity:1}
#controls button{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;color:var(--fg);background:rgba(255,255,255,.08)}
#controls button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#controls svg{width:14px;height:14px;fill:currentColor}
#scrub{flex:1;min-width:0;accent-color:var(--accent)}
#time{font-variant-numeric:tabular-nums;min-width:9ch;text-align:right;color:var(--fg)}
</style>

      <text id="pvoLbl" fill="#ff8080" font-family="JetBrains Mono,monospace" font-size="20" font-weight="600" letter-spacing="2">ППО · РЕБ</text>
    </g>
    <g id="smalls"></g>
    <g id="eyes"></g>
    <g id="sea" opacity="0">
      <circle cx="0" cy="0" r="70" fill="url(#glow)"/>
      <use href="#tb2" x="-28" y="-17" width="56" height="34"/>
    </g>
  </g>

  <!-- tags -->
  <g id="tags" font-family="JetBrains Mono,monospace" font-weight="600"></g>
</svg>
<canvas id="grain" width="225" height="400"></canvas>
<div id="vig"></div>
<div class="ui corners"><i></i><i></i><i></i><i></i></div>
<div class="ui" id="chapter"><span class="num">08 / 09</span> · ЦІНА<div class="bar"><b id="prog"></b></div></div>
<div class="ui" id="mark">BAYRAKTAR TB2</div>
<div id="fade"></div>

<div id="controls">
  <button id="play" type="button" aria-label="Пауза">
    <svg id="icoPause" viewBox="0 0 16 16"><rect x="3" y="2" width="3.5" height="12"/><rect x="9.5" y="2" width="3.5" height="12"/></svg>
    <svg id="icoPlay" viewBox="0 0 16 16" hidden><path d="M4 2l10 6-10 6z"/></svg>
  </button>
  <input id="scrub" type="range" min="0" max="18" step="0.01" value="0" aria-label="Час сцени">
  <span id="time">00.0 / 18.0</span>
</div>

<script>
(() => {
const DUR = 18;
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || $('#diagram')).appendChild(e); return e; };
const clamp01 = x => Math.min(1, Math.max(0, x));
const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const win = (a, b, c, d, t) => smooth(a, b, t) * (1 - smooth(c, d, t));

/* voice-over this scene is paced to (no captions on screen; retime after the recording)
   0.3–1.9   Скільки коштує таке небо?
   2.1–4.4   Близько п'яти мільйонів доларів.
   4.6–7.2   Приблизно в шість разів дешевше за американського «Ріпера».
   7.6–9.4   Витривалий, тихий, зіркий. У двадцять другому він став очима країни.
   9.6–11.6  А люди всією країною збирали гроші на нові.
   11.8–14.3 Згодом ППО і РЕБ зробили фронт для нього надто небезпечним.
   14.4–15.8 Роботу перебрали малі дрони.
   15.9–17.6 Але першим показав, як це працює, — він.
   Map: Natural Earth 1:50m (public domain), Ukraine within internationally recognised borders, Crimea included.
   The front line is schematic (approximately 2023), not a precise position. */

/* projection shared with the outline: x = (lon − 31.2)·cos 48.5°·68 + 450, y = −(lat − 48.6)·68 + 900 */
const P = (lon, lat) => [(lon - 31.2) * Math.cos(48.5 * Math.PI / 180) * 68 + 450, -(lat - 48.6) * 68 + 900];

/* ---------- cubes ---------- */
const CUBE = 78;
function cube(parent, cx, by, i) {
  const s = CUBE, d = s * 0.45, y = by - i * s;
  const g = el('g', { opacity: 0 }, parent);
  el('path', { d: `M${cx - s / 2} ${y} h${s} v${-s} h${-s} Z`, fill: '#1d3550', stroke: '#9fd0ff', 'stroke-width': 2 }, g);
  el('path', { d: `M${cx - s / 2} ${y - s} l${d} ${-d * 0.6} h${s} l${-d} ${d * 0.6} Z`, fill: '#2a4a6e', stroke: '#9fd0ff', 'stroke-width': 2 }, g);
  el('path', { d: `M${cx + s / 2} ${y} v${-s} l${d} ${-d * 0.6} v${s} Z`, fill: '#152a40', stroke: '#9fd0ff', 'stroke-width': 2 }, g);
  return g;
}
const cubesTB2 = [cube($('#cubesTB2'), 260, 1190, 0)];
const cubesMQ = [0, 1, 2, 3, 4, 5].map(i => cube($('#cubesMQ'), 620, 1190, i));
cubesTB2.forEach(g => g.querySelectorAll('path').forEach(p => p.setAttribute('stroke', '#ff9a66')));

/* ---------- map layers ---------- */
const CITIES = {"Київ": [419.4, 774.2], "Львів": [126.9, 815.7], "Харків": [676.6, 805.5], "Одеса": [428.4, 1044.2], "Дніпро": [623.5, 909.5], "Запоріжжя": [627.5, 951.7], "Вінниця": [327.0, 857.2], "Полтава": [600.9, 832.7], "Чернігів": [454.1, 703.5], "Ужгород": [48.5, 898.6], "Івано-Франківськ": [157.6, 878.2], "Рівне": [227.0, 762.6], "Луцьк": [185.5, 753.8], "Житомир": [335.6, 787.8], "Черкаси": [488.8, 842.9], "Суми": [612.2, 742.9], "Миколаїв": [485.6, 1010.8], "Кропивницький": [497.8, 906.1], "Тернопіль": [197.2, 835.4], "Хмельницький": [260.3, 844.2], "Чернівці": [213.0, 921.1]};
const cityOrder = ['Київ','Львів','Харків','Одеса','Дніпро','Вінниця','Полтава','Житомир','Чернігів','Рівне','Ужгород','Луцьк','Тернопіль','Івано-Франківськ','Хмельницький','Чернівці','Черкаси','Кропивницький','Миколаїв','Суми','Запоріжжя'];
const cityDots = cityOrder.map(n => { const [x, y] = CITIES[n]; const g = el('g', { opacity: 0 }, $('#cities'));
  el('circle', { cx: x, cy: y, r: 26, fill: 'url(#oglow)' }, g); el('circle', { cx: x, cy: y, r: 6, fill: '#ff9a66' }, g); return g; });
/* eyes of the country in 2022: a few TB2 footprints over the north and south */
const EYES = [P(30.2, 51.1), P(29.0, 50.7), P(33.2, 51.0), P(31.5, 46.8)];
const eyes = EYES.map(([x, y]) => { const g = el('g', { opacity: 0 }, $('#eyes'));
  el('circle', { cx: x, cy: y, r: 62, fill: 'url(#glow)' }, g);
  el('circle', { cx: x, cy: y, r: 46, fill: 'none', stroke: '#5aa8ff', 'stroke-width': 1.5, 'stroke-dasharray': '4 5' }, g);
  el('use', { href: '#tb2', x: x - 22, y: y - 14, width: 44, height: 28 }, g); return g; });
/* schematic front, ~2023 */
const FRONT = [[38.1, 50.2], [37.9, 49.6], [38.1, 49.0], [37.9, 48.6], [37.6, 48.1], [37.2, 47.8], [36.3, 47.6], [35.5, 47.4], [34.6, 47.25], [33.7, 46.95], [32.8, 46.65], [32.0, 46.5]].map(([a, b]) => P(a, b));
$('#front').setAttribute('d', 'M' + FRONT.map(p => p.map(v => v.toFixed(1)).join(' ')).join(' L'));
const OFF = [52, 40];
$('#pvo').setAttribute('d', 'M' + FRONT.map(p => p.join(' ')).join(' L') + ' L' + FRONT.slice().reverse().map(([x, y]) => `${x + OFF[0]} ${y + OFF[1]}`).join(' L') + ' Z');
$('#pvoLbl').setAttribute('x', FRONT[7][0] + 10); $('#pvoLbl').setAttribute('y', FRONT[7][1] + 78);
const FRONT_TB2 = P(36.6, 48.4);
const frontEye = el('g', { opacity: 0 }, $('#eyes'));
el('circle', { cx: FRONT_TB2[0], cy: FRONT_TB2[1], r: 46, fill: 'none', stroke: '#5aa8ff', 'stroke-width': 1.5, 'stroke-dasharray': '4 5' }, frontEye);
el('use', { href: '#tb2', x: FRONT_TB2[0] - 22, y: FRONT_TB2[1] - 14, width: 44, height: 28 }, frontEye);
const crossFront = el('path', { d: `M${FRONT_TB2[0] - 14} ${FRONT_TB2[1] - 14} l28 28 m0 -28 l-28 28`, stroke: '#ff4d4d', 'stroke-width': 4, opacity: 0 }, $('#eyes'));
/* small drones along the front */
const smalls = [];
for (let i = 0; i < 46; i++) {
  const k = (i + 0.5) / 46 * (FRONT.length - 1), a = Math.floor(k), f = k - a;
  const p0 = FRONT[a], p1 = FRONT[Math.min(a + 1, FRONT.length - 1)];
  const side = ((i * 37) % 7) / 7;
  const x = lerp(p0[0], p1[0], f) - 18 - side * 34, y = lerp(p0[1], p1[1], f) - 8 - side * 20;
  const g = el('g', { opacity: 0 }, $('#smalls'));
  el('circle', { cx: x, cy: y, r: 9, fill: 'none', stroke: '#9fd0ff', 'stroke-width': 1.2 }, g);
  el('circle', { cx: x, cy: y, r: 2.6, fill: '#9fd0ff' }, g);
  smalls.push({ g, d: i / 46 });
}
const SEA = P(31.0, 45.25);

/* ---------- tags ---------- */
function tag(text, sub, x, y, anchor) {
  const g = el('g', { opacity: 0 }, $('#tags'));
  const tx = el('text', { x, y, 'text-anchor': anchor || 'start', fill: '#eef1f4', 'font-size': 22, 'letter-spacing': 1.5 }, g); tx.textContent = '■ ' + text;
  if (sub) { const s = el('text', { x, y: y + 26, 'text-anchor': anchor || 'start', fill: '#8e9aab', 'font-size': 17, 'font-weight': 400 }, g); s.textContent = sub; }
  return g;
}
const tEyes = tag('ОЧІ КРАЇНИ', 'весна 2022', 70, 560);
const tPeople = tag('НАРОДНИЙ БАЙРАКТАР', 'збір 2022 року', 70, 560);
const tSmall = tag('FPV · РОЗВІДУВАЛЬНІ КРИЛА', 'беруть на себе фронт', 70, 560);
const tSea = tag('TB2 · ДАЛЬНЯ РОЗВІДКА · МОРЕ', '', SEA[0], SEA[1] + 70, 'middle');
const note = el('text', { x: 450, y: 1330, 'text-anchor': 'middle', fill: '#5d6f84', 'font-family': 'JetBrains Mono,monospace', 'font-size': 16, opacity: 0 }, $('#tags'));
note.textContent = 'лінія фронту схематична · кордони визнані міжнародно';

/* grain */
const gctx = $('#grain').getContext('2d'), gimg = gctx.createImageData(225, 400);
function grain(t) {
  let s = Math.floor(t * 30) * 9301 + 49297;
  for (let i = 0; i < gimg.data.length; i += 4) { s = (s * 9301 + 49297) % 233280; const v = s / 233280 * 255; gimg.data[i] = gimg.data[i + 1] = gimg.data[i + 2] = v; gimg.data[i + 3] = 255; }
  gctx.putImageData(gimg, 0, 0);
}
const op = (e, v) => e.setAttribute('opacity', v.toFixed(3));

function render(t) {
  op($('#titleG'), win(0.1, 0.4, 1.9, 2.3, t));
  /* price */
  const priceA = win(1.9, 2.3, 7.3, 7.7, t);
  op($('#priceG'), priceA);
  const drop = (g, t0) => { const u = smooth(t0, t0 + 0.35, t); op(g, u); g.setAttribute('transform', `translate(0 ${(-60 * (1 - u)).toFixed(1)})`); };
  drop(cubesTB2[0], 2.2);
  cubesMQ.forEach((g, i) => drop(g, 4.7 + i * 0.28));
  op($('#lblMQ'), smooth(4.7, 5.0, t)); op($('#valMQ'), smooth(6.4, 6.7, t)); op($('#legend'), smooth(5.2, 5.6, t));
  /* map */
  op($('#mapG'), smooth(7.5, 8.0, t));
  eyes.forEach((g, i) => op(g, win(7.8 + i * 0.25, 8.2 + i * 0.25, 11.5, 11.9, t)));
  op(tEyes, win(8.2, 8.5, 9.4, 9.6, t));
  cityDots.forEach((g, i) => op(g, win(9.7 + i * 0.075, 9.9 + i * 0.075, 11.6, 12.0, t)));
  op(tPeople, win(9.8, 10.1, 11.5, 11.8, t));
  op($('#frontG'), smooth(11.8, 12.4, t));
  op(frontEye, win(11.9, 12.2, 13.8, 14.3, t));
  op(crossFront, win(13.0, 13.2, 13.9, 14.3, t));
  smalls.forEach(s => op(s.g, smooth(14.4 + s.d * 1.0, 14.6 + s.d * 1.0, t)));
  op(tSmall, win(14.6, 14.9, 15.7, 15.9, t));
  const u = smooth(15.6, 16.6, t);
  const sx = lerp(FRONT_TB2[0], SEA[0], u), sy = lerp(FRONT_TB2[1], SEA[1], u);
  $('#sea').setAttribute('transform', `translate(${sx.toFixed(1)} ${sy.toFixed(1)})`); op($('#sea'), smooth(15.5, 15.9, t));
  op(tSea, smooth(16.5, 16.9, t));
  op(note, smooth(12.2, 12.8, t));
  $('#prog').style.width = (100 * t / DUR) + '%';
  $('#fade').style.opacity = 1 - smooth(0, 0.3, t);
  grain(t);
}

/* transport and capture contract */
const scrub = $('#scrub'), timeEl = $('#time'), playBtn = $('#play');
let t = 0, playing = !window.matchMedia('(prefers-reduced-motion: reduce)').matches, last = performance.now(), scrubbing = false;
function setPlaying(p) { playing = p; $('#icoPause').hidden = !p; $('#icoPlay').hidden = p; playBtn.setAttribute('aria-label', p ? 'Пауза' : 'Відтворити'); }
setPlaying(playing); if (!playing) t = 6.8;
playBtn.addEventListener('click', () => setPlaying(!playing));
scrub.addEventListener('input', () => { scrubbing = true; t = parseFloat(scrub.value); });
scrub.addEventListener('change', () => { scrubbing = false; });
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing && !scrubbing) { t += dt; if (t >= DUR) t -= DUR; }
  render(t);
  if (!scrubbing) scrub.value = t.toFixed(2);
  timeEl.textContent = t.toFixed(1).padStart(4, '0') + ' / ' + DUR.toFixed(1);
  requestAnimationFrame(loop);
}
window.DURATION = DUR; window.FPS = 30;
window.seek = s => { t = s; render(s); };
if (new URLSearchParams(location.search).has('render')) { $('#controls').hidden = true; render(0); }
else requestAnimationFrame(loop);
})();
</script>

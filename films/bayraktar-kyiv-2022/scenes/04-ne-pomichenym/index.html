<script>
(() => {
const DUR = 15;
const $ = s => document.querySelector(s);
const clamp01 = x => Math.min(1, Math.max(0, x));
const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const win = (a, b, c, d, t) => smooth(a, b, t) * (1 - smooth(c, d, t));
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const alongX = g => { g.rotateZ(-Math.PI / 2); return g; };
const across = g => { g.rotateX(Math.PI / 2); return g; };

/* voice-over this scene is paced to (no captions on screen; retime after the recording)
   0.3–4.2   На висоті близько п'яти кілометрів гул мотора розчиняється.
   4.3–5.8   З землі його не чути.
   6.3–9.6   І не видно: сірий силует на сірому небі.
   10.2–11.6 Він не ховається…
   12.4–14.0 Він просто далеко. */

/* ---------- renderer & world ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
$('#stage').appendChild(renderer.domElement);
const W = () => Math.floor(innerWidth * renderer.getPixelRatio()), H = () => Math.floor(innerHeight * renderer.getPixelRatio());
const scene = new THREE.Scene();
const field = scene;
const NAVY = new THREE.Color(0x0b0f16), SKY = new THREE.Color(0x8d959a);
scene.background = NAVY.clone();
scene.add(new THREE.HemisphereLight(0xe6edf2, 0x5b5648, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 0.55); sun.position.set(-300, 800, 400); scene.add(sun);
const cam = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.3, 60000);

/* ground: schematic grid in the cross-section, muted fields near the soldier */
const groundMat = new THREE.ShaderMaterial({
  uniforms: { uField: { value: 0 } }, extensions: { derivatives: true },
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform float uField; varying vec3 vW;
    float h(vec2 p){ return fract(sin(dot(floor(p), vec2(127.1, 311.7))) * 43758.5453); }
    float line(float c, float w){ float f = abs(fract(c - 0.5) - 0.5) / fwidth(c); return 1.0 - min(f / w, 1.0); }
    void main(){
      float g = max(line(vW.x / 250.0, 1.0), line(vW.z / 250.0, 1.0)) * 0.22;
      vec3 sch = vec3(0.055, 0.075, 0.11) + vec3(0.25, 0.5, 0.9) * g * 0.6;
      float n = h(vW.xz / vec2(60.0, 45.0));
      vec3 fld = n < 0.33 ? vec3(0.50, 0.46, 0.34) : n < 0.66 ? vec3(0.40, 0.42, 0.30) : vec3(0.34, 0.30, 0.24);
      float d = length(vW.xz); fld = mix(fld, vec3(0.55, 0.58, 0.6), smoothstep(200.0, 2500.0, d));
      gl_FragColor = vec4(mix(sch, fld, uField), 1.0);
    }`
});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60000, 60000), groundMat);
ground.rotation.x = -Math.PI / 2; scene.add(ground);
/* in the cross-section the ground is just a line at zero, with a dot for the column */
const groundLine = new THREE.Mesh(new THREE.BoxGeometry(60000, 6, 6), new THREE.MeshBasicMaterial({ color: 0x4f86c9, transparent: true, opacity: 0, fog: false }));
groundLine.position.set(0, 0, -1600); scene.add(groundLine);

const swaps = [];
const irCache = {};
const irMat = h => irCache[h] || (irCache[h] = new THREE.MeshBasicMaterial({ color: new THREE.Color(h, h, h) }));
function fmesh(geo, dayColor, heat, x, y, z, parent) {
  const day = new THREE.MeshLambertMaterial({ color: dayColor });
  const m = new THREE.Mesh(geo, day); m.position.set(x, y, z);
  m.userData.day = day; m.userData.ir = irMat(heat); swaps.push(m);
  (parent || field).add(m); return m;
}
function hash(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }

fmesh(new THREE.BoxGeometry(4000, 0.05, 8), 0x6b6455, 0.2, 0, 0.03, 0);
const OL = 0x4b5229, OD = 0x3a3f20, TR = 0x2c2b26, CV = 0x5c5a3a;
/* БМП-2 from the reference projections: wedge nose with a long ribbed glacis, low hull with inward-leaning sides,
   six road wheels, front sprocket, rear idler, three return rollers, side skirts, small octagonal turret with a long
   thin gun and a missile tube on the roof, four troop hatches, two rear doors. Engine sits front right. */
function bmp(x) {
  const g = new THREE.Group(); g.position.set(x, 0, 0); field.add(g);
  const P = [[-3.32, 0.45], [2.85, 0.45], [3.38, 0.98], [1.15, 1.78], [0.55, 1.86], [-3.38, 1.86]];
  const hg = new THREE.ExtrudeGeometry(new THREE.Shape(P.map(([a, b]) => new THREE.Vector2(a, b))), { depth: 2.95, bevelEnabled: false });
  hg.translate(0, 0, -1.475);
  const hp = hg.attributes.position;
  for (let i = 0; i < hp.count; i++) if (hp.getY(i) > 1.2) hp.setZ(i, hp.getZ(i) * 0.86);
  hg.computeVertexNormals();
  fmesh(hg, OL, 0.42, 0, 0, 0, g);
  /* ribbed glacis */
  const n0 = V(3.38, 0.98, 0), n1 = V(1.15, 1.78, 0), slope = -Math.atan2(n1.y - n0.y, n0.x - n1.x);
  for (let k = 0; k < 11; k++) {
    const p = n0.clone().lerp(n1, (k + 0.5) / 11);
    const zw = lerp(2.85, 2.55, (k + 0.5) / 11);
    const r = fmesh(new THREE.BoxGeometry(0.05, 0.05, zw), OD, 0.44, p.x, p.y + 0.03, 0, g); r.rotation.z = slope;
  }
  /* engine grille front right and exhaust on the right side: the warmest spots */
  const gp = n0.clone().lerp(n1, 0.62);
  const gr = fmesh(new THREE.BoxGeometry(0.85, 0.05, 0.85), OD, 0.97, gp.x, gp.y + 0.05, 0.62, g); gr.rotation.z = slope;
  fmesh(new THREE.BoxGeometry(0.4, 0.22, 0.06), OD, 1.0, 1.9, 1.38, 1.3, g);
  /* roof: troop hatches, rear doors */
  [[-1.0, 0.55], [-1.0, -0.55], [-1.95, 0.55], [-1.95, -0.55]].forEach(([hx, hz]) => fmesh(new THREE.BoxGeometry(0.75, 0.05, 0.5), OD, 0.4, hx, 1.89, hz, g));
  [0.55, -0.55].forEach(dz => fmesh(new THREE.BoxGeometry(0.05, 0.95, 0.72), OD, 0.4, -3.4, 1.05, dz, g));
  /* turret, gun, missile tube, smoke launchers */
  fmesh(new THREE.CylinderGeometry(0.78, 1.02, 0.48, 8), OL, 0.4, 0.05, 2.1, 0, g);
  fmesh(new THREE.CylinderGeometry(0.26, 0.26, 0.12, 10), OD, 0.4, -0.2, 2.4, -0.3, g);
  fmesh(new THREE.BoxGeometry(0.28, 0.22, 0.26), OD, 0.38, 0.35, 2.43, 0.35, g);
  const gun = fmesh(alongX(new THREE.CylinderGeometry(0.045, 0.05, 2.9, 8)), OD, 0.3, 1.75, 2.2, 0.1, g); gun.rotation.z = 0.05;
  fmesh(alongX(new THREE.CylinderGeometry(0.075, 0.075, 0.25, 8)), OD, 0.3, 3.18, 2.27, 0.1, g);
  fmesh(new THREE.BoxGeometry(0.12, 0.2, 0.08), OD, 0.36, 0.0, 2.45, -0.36, g);
  fmesh(alongX(new THREE.CylinderGeometry(0.085, 0.085, 1.25, 10)), OD, 0.36, 0.05, 2.6, -0.36, g);
  [1, -1].forEach(s => [0, 1, 2].forEach(k => fmesh(new THREE.CylinderGeometry(0.05, 0.05, 0.22, 8), OD, 0.36, -0.35 + k * 0.18, 2.15, s * 0.9, g)));
  /* running gear, both sides */
  const trackShape = new THREE.Shape([new THREE.Vector2(-0.03, -0.19), new THREE.Vector2(0.03, -0.19), new THREE.Vector2(0.03, 0.19), new THREE.Vector2(-0.03, 0.19)]);
  const trackPath = new THREE.CatmullRomCurve3([V(-3.1, 0.16, 0), V(-2.4, 0.05, 0), V(2.2, 0.05, 0), V(2.95, 0.33, 0), V(3.22, 0.7, 0), V(2.95, 0.98, 0),
    V(1.5, 1.04, 0), V(-1.5, 1.04, 0), V(-3.0, 0.92, 0), V(-3.42, 0.55, 0)], true);
  const trackGeo = new THREE.ExtrudeGeometry(trackShape, { steps: 140, extrudePath: trackPath, bevelEnabled: false });
  [1, -1].forEach(s => {
    const zc = s * 1.33;
    fmesh(trackGeo, TR, 0.6, 0, 0, zc, g);
    for (let i = 0; i < 6; i++) {
      const xw = 2.2 - i * 0.93;
      fmesh(across(new THREE.CylinderGeometry(0.37, 0.37, 0.2, 16)), 0x3b3d2c, 0.6, xw, 0.42, zc, g);
      fmesh(across(new THREE.CylinderGeometry(0.13, 0.13, 0.24, 10)), TR, 0.68, xw, 0.42, zc, g);
    }
    fmesh(across(new THREE.CylinderGeometry(0.3, 0.3, 0.22, 10)), TR, 0.66, 2.95, 0.68, zc, g);
    fmesh(across(new THREE.CylinderGeometry(0.32, 0.32, 0.22, 12)), TR, 0.58, -3.12, 0.55, zc, g);
    [1.5, 0.0, -1.5].forEach(rx => fmesh(across(new THREE.CylinderGeometry(0.1, 0.1, 0.18, 8)), TR, 0.6, rx, 0.93, zc, g));
    for (let k = 0; k < 4; k++) fmesh(new THREE.BoxGeometry(1.42, 0.3, 0.04), OL, 0.44, 1.95 - k * 1.5, 1.13, s * 1.55, g);
  });
  return g;
}
/* T-72B from the reference drawings: wedge nose with a long upper glacis, low hull with fenders, rubber side
   skirts carrying a row of reactive-armour blocks, six large road wheels, front idler, rear sprocket, three return
   rollers, a low cast dome turret with chevron blocks on its face, commander's cupola with a machine gun, a very
   long gun with sleeve segments and a fume extractor, two fuel drums and a log at the rear. Engine at the rear. */
function tank(x) {
  const g = new THREE.Group(); g.position.set(x, 0, 0); field.add(g);
  const P = [[-3.42, 0.45], [2.78, 0.45], [3.45, 1.0], [2.0, 1.55], [-3.45, 1.55]];
  const hg = new THREE.ExtrudeGeometry(new THREE.Shape(P.map(([a, b]) => new THREE.Vector2(a, b))), { depth: 2.2, bevelEnabled: false });
  hg.translate(0, 0, -1.1);
  fmesh(hg, OL, 0.42, 0, 0, 0, g);
  fmesh(new THREE.BoxGeometry(6.7, 0.06, 3.5), OL, 0.44, -0.3, 1.57, 0, g);
  /* blocks across the upper glacis */
  const n0 = V(3.45, 1.0, 0), n1 = V(2.0, 1.55, 0), slope = -Math.atan2(n1.y - n0.y, n0.x - n1.x);
  for (let r = 0; r < 3; r++) for (let c = -4; c <= 4; c++) {
    const p = n0.clone().lerp(n1, 0.2 + r * 0.28);
    const b = fmesh(new THREE.BoxGeometry(0.42, 0.1, 0.34), OD, 0.43, p.x, p.y + 0.06, c * 0.37, g); b.rotation.z = slope;
  }
  /* rear: engine deck, exhaust on the left, drums and log */
  fmesh(new THREE.BoxGeometry(2.0, 0.06, 2.4), OD, 0.97, -2.35, 1.6, 0, g);
  fmesh(new THREE.BoxGeometry(0.5, 0.2, 0.3), OD, 1.0, -2.7, 1.58, -1.65, g);
  [0.75, -0.75].forEach(dz => fmesh(across(new THREE.CylinderGeometry(0.3, 0.3, 0.85, 12)), 0x434a28, 0.4, -3.68, 1.25, dz, g));
  fmesh(across(new THREE.CylinderGeometry(0.13, 0.13, 3.1, 8)), 0x4a3f2c, 0.38, -3.7, 1.75, 0, g);
  /* turret: low dome, chevron blocks, cupola, machine gun */
  const dome = new THREE.SphereGeometry(1.32, 18, 10, 0, Math.PI * 2, 0, Math.PI / 2); dome.scale(1.18, 0.55, 1.0);
  fmesh(dome, OL, 0.4, 0.2, 1.58, 0, g);
  [1, -1].forEach(s => { for (let k = 0; k < 5; k++) {
    const a = s * (0.22 + k * 0.17), rr = 1.32 - k * 0.04;
    const b = fmesh(new THREE.BoxGeometry(0.36, 0.22, 0.12), OD, 0.42, 0.2 + Math.cos(a) * rr * 1.12, 1.82 - k * 0.03, Math.sin(a) * rr, g);
    b.rotation.y = -a + Math.PI / 2; b.rotation.x = 0.25 * s;
  } });
  fmesh(new THREE.CylinderGeometry(0.36, 0.38, 0.22, 12), OD, 0.4, -0.15, 2.38, 0.5, g);
  fmesh(alongX(new THREE.CylinderGeometry(0.035, 0.035, 1.2, 6)), OD, 0.32, 0.4, 2.62, 0.5, g);
  fmesh(new THREE.BoxGeometry(0.3, 0.26, 0.24), OD, 0.38, 0.55, 2.3, -0.45, g);
  /* the long gun: sleeve segments and a fume extractor */
  const gun = new THREE.Group(); gun.position.set(1.25, 2.02, 0); gun.rotation.z = 0.02; g.add(gun);
  fmesh(alongX(new THREE.CylinderGeometry(0.085, 0.09, 5.9, 10)), OD, 0.3, 2.95, 0, 0, gun);
  [0.6, 1.5, 3.4, 4.4].forEach(sx => fmesh(alongX(new THREE.CylinderGeometry(0.11, 0.11, 0.7, 10)), OD, 0.3, sx, 0, 0, gun));
  fmesh(alongX(new THREE.CylinderGeometry(0.15, 0.15, 0.55, 12)), OD, 0.3, 2.45, 0, 0, gun);
  fmesh(alongX(new THREE.CylinderGeometry(0.1, 0.1, 0.18, 10)), OD, 0.3, 5.85, 0, 0, gun);
  /* running gear and skirts, both sides */
  const ts = new THREE.Shape([new THREE.Vector2(-0.03, -0.29), new THREE.Vector2(0.03, -0.29), new THREE.Vector2(0.03, 0.29), new THREE.Vector2(-0.03, 0.29)]);
  const tp = new THREE.CatmullRomCurve3([V(3.3, 0.6, 0), V(3.02, 0.95, 0), V(1.5, 1.06, 0), V(-1.5, 1.06, 0), V(-3.15, 0.98, 0), V(-3.52, 0.62, 0),
    V(-3.05, 0.08, 0), V(-2.4, 0.05, 0), V(2.4, 0.05, 0), V(3.0, 0.2, 0)], true);
  const tg = new THREE.ExtrudeGeometry(ts, { steps: 150, extrudePath: tp, bevelEnabled: false });
  [1, -1].forEach(s => {
    const zc = s * 1.42;
    fmesh(tg, TR, 0.6, 0, 0, zc, g);
    for (let i = 0; i < 6; i++) {
      const xw = 2.3 - i * 0.9;
      fmesh(across(new THREE.CylinderGeometry(0.375, 0.375, 0.24, 18)), 0x3b3d2c, 0.6, xw, 0.42, zc, g);

/* a faint dot marks the drone where it is far smaller than a pixel */

/* altitude ruler */
const RULER_X = -1250, RULER_Z = DRONE_AT.z;

{

/* ---------- insets and compositing ---------- */
const RT = 768;
const rtMain = new THREE.WebGLRenderTarget(W(), H()), rtA = new THREE.WebGLRenderTarget(RT, RT), rtB = new THREE.WebGLRenderTarget(RT, RT);
const camA = new THREE.PerspectiveCamera(30, 1, 0.1, 60000), camB = new THREE.PerspectiveCamera(30, 1, 0.1, 60000);
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: { tMain: { value: rtMain.texture }, tA: { value: rtA.texture }, tB: { value: rtB.texture },
    uA: { value: new THREE.Vector3(0.7, 0.78, 0) }, uB: { value: new THREE.Vector3(0.7, 0.24, 0) },
    uAspect: { value: 1 }, uTime: { value: 0 }, uFade: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,

/* ---------- callouts ---------- */
const coLayer = $('#callouts'), svgNS = 'http://www.w3.org/2000/svg';

  coLayer.appendChild(el); const line = document.createElementNS(svgNS, 'line'); lead.appendChild(line); return { el, line };

function place(co, a, x, y, ax, ay, left) {

const toScreen = (p, c) => { const v = p.clone().project(c); return [(v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight, v.z]; };

/* ---------- camera path ---------- */
const COLUMN_POS = V(0, 2450, 9200), COLUMN_LOOK = V(0, 2450, -800);
function headPos() { return soldier.userData.B.Head.getWorldPosition(V(0, 0, 0)); }
function render(t) {
  scene.updateMatrixWorld(true);
  const head = headPos();
  const toDrone = DRONE_AT.clone().sub(head).normalize();
  const flat = V(toDrone.x, 0, toDrone.z).normalize();
  const povPos = head.clone().addScaledVector(flat, -2.6).add(V(0.6, 1.05, 0));
  const povLook = head.clone().addScaledVector(flat, 5).add(V(0, -0.2, 0));
  const nearPos = DRONE_AT.clone().add(V(13, 7, 24));

  let pos, look, fov = 34, phase;
  if (t < 6.0) { phase = 'column'; pos = COLUMN_POS.clone(); look = COLUMN_LOOK.clone(); pos.y += t * 6; }
  else if (t < 11.0) { phase = 'pov'; const u = smooth(6.4, 8.0, t); pos = povPos.clone(); look = povLook.clone().lerp(povPos.clone().addScaledVector(toDrone, 100), u * 0.92); fov = 52; }
  else if (t < 12.4) { phase = 'rise'; const u = smooth(11.0, 12.3, t);

    pos = nearPos.clone().lerp(COLUMN_POS, Math.pow(u, 0.55)); look = DRONE_AT.clone().lerp(COLUMN_LOOK, Math.pow(u, 0.7)); fov = lerp(32, 34, u); }

  cam.fov = fov; cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); cam.updateMatrixWorld();

  /* sky and ground follow the phase */
  const fieldMix = phase === 'pov' || phase === 'rise' ? 1 : phase === 'back' ? 1 - smooth(12.6, 13.8, t) : 0;
  scene.background.copy(NAVY).lerp(SKY, fieldMix);
  groundMat.uniforms.uField.value = fieldMix;
  ground.visible = fieldMix > 0.02;
  groundLine.material.opacity = (phase === 'column' ? win(0.3, 0.8, 5.6, 6.0, t) : phase === 'back' ? smooth(13.2, 14.0, t) : 0) * 0.9;
  scene.fog = fieldMix > 0.5 ? new THREE.Fog(SKY, 400, 6000) : null;

  /* rings: only in the cross-section */
  const ringsOn = phase === 'column' ? win(0.3, 0.8, 5.6, 6.0, t) : phase === 'back' ? smooth(13.6, 14.4, t) : 0;
  rings.forEach((ring, i) => {
    const period = 0.62 * RINGS, age = ((t - 0.4 - i * 0.62) % period + period) % period;
    const r = 30 + age * 900;
    ring.scale.setScalar(r);
    ringMats[i].opacity = ringsOn * 0.85 * Math.pow(clamp01(1 - r / 4600), 1.8) * (t > 0.4 + i * 0.62 || phase === 'back' ? 1 : 0);
  });
  rulerMat.opacity = phase === 'column' ? win(0.4, 1.2, 5.6, 6.0, t) : phase === 'back' ? smooth(13.4, 14.2, t) : 0;
  const rulerA = Number(rulerMat.opacity.toFixed(3));
  rulerLabels.forEach((el, k) => {
    const [x, y] = toScreen(V(RULER_X, k * 1000, RULER_Z), cam);
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.opacity = rulerA;
  });

  /* the dot where the drone is: visible only from afar */
  const dist = cam.position.distanceTo(DRONE_AT);
  dot.position.copy(DRONE_AT); dot.scale.setScalar(dist * 0.0032);
  dot.material.opacity = (phase === 'column' || phase === 'back') ? 0.95 * smooth(800, 3000, dist) : 0;
  gdot.position.copy(HERO.position); gdot.scale.setScalar(cam.position.distanceTo(HERO.position) * 0.0032); gdot.material.opacity = dot.material.opacity * (phase === 'column' ? 1 : smooth(13.4, 14.2, t));

  /* insets: drone close-up and ground close-up in the cross-section; a searching loupe in the soldier's view */
  const aspect = innerWidth / innerHeight;
  Q.uAspect.value = aspect;
  let A = 0, B = 0;
  if (phase === 'column') { A = 0.135 * win(0.8, 1.3, 5.6, 6.0, t); B = 0.135 * win(2.0, 2.5, 5.6, 6.0, t); Q.uA.value.set(0.70, 0.76, A); Q.uB.value.set(0.70, 0.27, B); }
  if (phase === 'pov') {
    A = 0.12 * win(7.0, 7.4, 10.6, 11.0, t);
    const target = toScreen(DRONE_AT, cam);
    const tx = target[0] / innerWidth, ty = 1 - target[1] / innerHeight;
    const u = smooth(7.2, 9.0, t);
    const sx = lerp(0.3, tx, u) + 0.04 * Math.sin(t * 3) * (1 - u), sy = lerp(0.62, ty, u) + 0.03 * Math.cos(t * 2.4) * (1 - u);

  renderer.setRenderTarget(rtMain); renderer.render(scene, cam);
  if (Q.uA.value.z > 0) {
    if (phase === 'column') { camA.position.copy(DRONE_AT).add(V(17, 5, 21)); camA.lookAt(DRONE_AT); camA.fov = 32; }
    else { // the loupe looks where it sits on screen, through a long lens
      const ndc = V(Q.uA.value.x * 2 - 1, Q.uA.value.y * 2 - 1, 0.5).unproject(cam);
      camA.position.copy(cam.position); camA.lookAt(ndc); camA.fov = 0.5;
    }
    camA.updateProjectionMatrix();

  }
  if (Q.uB.value.z > 0) {
    camB.position.copy(HERO.position).add(V(7.5, 5.2, 9.5)); camB.lookAt(HERO.position.clone().add(V(-0.6, 1.8, 0.4))); camB.fov = 34; camB.updateProjectionMatrix();
    dot.visible = gdot.visible = false; const gv = ground.visible; ground.visible = true; const ub = groundMat.uniforms.uField.value; groundMat.uniforms.uField.value = 1;
    renderer.setRenderTarget(rtB); renderer.render(scene, camB);
    dot.visible = gdot.visible = true; ground.visible = gv; groundMat.uniforms.uField.value = ub;
  }

  renderer.render(quadScene, quadCam);

  /* DOM */
  $('#rubric').style.opacity = win(0.1, 0.5, 1.6, 2.1, t);
  const vw = innerWidth, vh = innerHeight;
  if (phase === 'column' && A > 0) {
    const [dx, dy] = toScreen(DRONE_AT, cam);
    const cx = Q.uA.value.x * vw, cy = (1 - Q.uA.value.y) * vh, rp = A * vh;
    place(coDrone, win(1.2, 1.6, 5.5, 5.9, t), cx - rp * 0.2, cy - rp - 22, dx, dy, false);
    coDrone.line.setAttribute('x2', cx - rp * 0.7); coDrone.line.setAttribute('y2', cy - rp * 0.7);
    coDrone.el.style.left = (cx - rp * 0.95) + 'px'; coDrone.el.style.top = (cy + rp + 28) + 'px';
  } else place(coDrone, 0);
  if (phase === 'column' && B > 0) {
    const [gx, gy] = toScreen(HERO.position, cam);

    place(coGround, win(4.3, 4.7, 5.5, 5.9, t), cx - rp * 0.95, cy - rp - 28, gx, gy, false);
    coGround.line.setAttribute('x2', cx - rp * 0.7); coGround.line.setAttribute('y2', cy + rp * 0.7);
  } else place(coGround, 0);
  $('#card').style.opacity = win(9.1, 9.5, 10.8, 11.1, t);
  $('#prog').style.width = (100 * t / DUR) + '%';
}

/* ---------- transport and capture contract ---------- */
const scrub = $('#scrub'), timeEl = $('#time'), playBtn = $('#play');
let t = 0, playing = !window.matchMedia('(prefers-reduced-motion: reduce)').matches, last = performance.now(), scrubbing = false;
function setPlaying(p) { playing = p; $('#icoPause').hidden = !p; $('#icoPlay').hidden = p; playBtn.setAttribute('aria-label', p ? 'Пауза' : 'Відтворити'); }
setPlaying(playing); if (!playing) t = 3.0;
playBtn.addEventListener('click', () => setPlaying(!playing));
scrub.addEventListener('input', () => { scrubbing = true; t = parseFloat(scrub.value); });
scrub.addEventListener('change', () => { scrubbing = false; });
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing && !scrubbing) { t += dt; if (t >= DUR) t -= DUR; }
  render(t);
  if (!scrubbing) scrub.value = t.toFixed(2);
  timeEl.textContent = t.toFixed(1).padStart(4, '0') + ' / ' + DUR.toFixed(1);
  requestAnimationFrame(loop);
}
window.addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); rtMain.setSize(W(), H()); });
window.DURATION = DUR; window.FPS = 30;
window.seek = s => { t = s; render(s); };

else requestAnimationFrame(loop);
})();
